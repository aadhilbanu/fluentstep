# Render Blueprint: deploys FluentStep as a free web service.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: fluentstep
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
